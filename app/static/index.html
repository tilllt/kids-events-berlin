<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kinder-Events Berlin</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>Kinder-Events Berlin</h1>
    <div class="sub">Veranstaltungen mit Kindern — gesammelt aus mehreren Quellen, ohne KI zur Laufzeit.</div>
    <div id="statusline" class="statusline">Lade…</div>
  </header>

  <div id="errorbar" class="errorbar hidden">
    <span id="errortext"></span>
    <button id="retrybtn" type="button">Erneut versuchen</button>
  </div>

  <main>
    <aside id="filters" class="filters-closed">
      <button id="filter-toggle" type="button" class="filter-toggle" aria-expanded="false" aria-controls="filter-body">
        <span>Filter</span>
        <span id="filter-count" class="filter-count hidden"></span>
      </button>
      <div id="filter-body">
      <section>
        <h2>Bezirk</h2>
        <div id="bezirk-list" class="checkgrid"></div>
      </section>
      <section>
        <h2>Alter</h2>
        <div id="alter-list" class="chips"></div>
      </section>
      <section>
        <h2>Uhrzeit</h2>
        <div id="uhrzeit-list" class="chips"></div>
      </section>
      <section>
        <h2>Wann</h2>
        <div id="zeitraum-list" class="chips"></div>
      </section>
      <section class="rowline">
        <label for="von">Von</label><input type="date" id="von" />
        <label for="bis">Bis</label><input type="date" id="bis" />
      </section>
      <section class="rowline">
        <label class="switch">
          <input type="checkbox" id="kostenlos" />
          <span>Nur kostenlos</span>
        </label>
        <button id="resetbtn" type="button" class="ghost">Filter zurücksetzen</button>
      </section>
      <div id="meta-note" class="metanote"></div>
      </div>
    </aside>

    <section id="content">
      <div id="liststate" class="hidden"></div>
      <ul id="eventlist"></ul>
      <div id="mapwrap">
        <h2 id="maptitle" class="maptitle">Kartenansicht</h2>
        <div id="map"></div>
      </div>
    </section>
  </main>

  <div id="detail" class="detail hidden" role="dialog" aria-modal="true" aria-labelledby="detail-titel">
    <div class="detail__card">
      <button id="detail-close" type="button" class="detail__close" aria-label="Schließen">✕</button>
      <h2 id="detail-titel"></h2>
      <div id="detail-body"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
