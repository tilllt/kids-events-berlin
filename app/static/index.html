<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kram für Kinder — Veranstaltungen in Berlin</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="/static/style.css?v=18" />
</head>
<body>
  <header>
    <div class="brand">
      <a href="/"><img src="/static/cia-logo.svg?v=18" alt="CIA Spandau — Medienzentrum für Kinder und Jugendliche" class="logo" /></a>
      <div>
        <h1>Kram für Kinder</h1>
        <div class="sub">Veranstaltungen für Kinder und Familien.</div>
      </div>
    </div>
    <div id="statusline" class="statusline">Lade…</div>
  </header>

  <div id="errorbar" class="errorbar hidden">
    <span id="errortext"></span>
    <button id="retrybtn" type="button">Erneut versuchen</button>
  </div>

  <main>
    <aside id="filters">
      <!-- Volltextsuche: immer sichtbar (nie mit eingeklappt) -->
      <section class="suche-sektion">
        <label for="suche" class="visually-hidden">Volltextsuche</label>
        <input type="search" id="suche" placeholder="Suchen… (z. B. Tag der offenen Tür, Workshop)" autocomplete="off" />
      </section>

      <!-- Filterkategorien als Tabs: spart vertikalen Platz, ein Panel je Kategorie -->
      <div class="filter-tabs" role="tablist" aria-label="Filter">
        <button type="button" class="filter-tab on" id="tab-bezirk" role="tab" aria-selected="true" aria-controls="panel-bezirk" data-panel="bezirk">Bezirk</button>
        <button type="button" class="filter-tab" id="tab-ort" role="tab" aria-selected="false" aria-controls="panel-ort" data-panel="ort">Ort</button>
        <button type="button" class="filter-tab" id="tab-alter" role="tab" aria-selected="false" aria-controls="panel-alter" data-panel="alter">Alter</button>
        <button type="button" class="filter-tab" id="tab-uhrzeit" role="tab" aria-selected="false" aria-controls="panel-uhrzeit" data-panel="uhrzeit">Uhrzeit</button>
        <button type="button" class="filter-tab" id="tab-wann" role="tab" aria-selected="false" aria-controls="panel-wann" data-panel="wann">Wann</button>
      </div>

      <div class="filter-panel" id="panel-bezirk" role="tabpanel" aria-labelledby="tab-bezirk">
        <div id="bezirk-list" class="checkgrid"></div>
      </div>
      <div class="filter-panel hidden" id="panel-ort" role="tabpanel" aria-labelledby="tab-ort">
        <label for="ort-suche" class="visually-hidden">Veranstaltungsort suchen</label>
        <input type="search" id="ort-suche" placeholder="Ort suchen… (z. B. Bibliothek)" autocomplete="off" />
        <div id="ort-list" class="checkgrid"></div>
        <p id="ort-hinweis" class="ort-hinweis hidden"></p>
      </div>
      <div class="filter-panel hidden" id="panel-alter" role="tabpanel" aria-labelledby="tab-alter">
        <div id="alter-list" class="chips"></div>
      </div>
      <div class="filter-panel hidden" id="panel-uhrzeit" role="tabpanel" aria-labelledby="tab-uhrzeit">
        <div id="uhrzeit-list" class="chips"></div>
      </div>
      <div class="filter-panel hidden" id="panel-wann" role="tabpanel" aria-labelledby="tab-wann">
        <div id="zeitraum-list" class="chips"></div>
        <div class="rowline">
          <label for="von">Von</label><input type="date" id="von" />
          <label for="bis">Bis</label><input type="date" id="bis" />
        </div>
      </div>

      <div class="filter-fuss">
        <label class="switch">
          <input type="checkbox" id="kostenlos" />
          <span>Nur kostenlos</span>
        </label>
        <span id="filter-count" class="filter-count-txt hidden"></span>
        <button id="resetbtn" type="button" class="ghost">Filter zurücksetzen</button>
      </div>
      <div id="meta-note" class="metanote"></div>
    </aside>

    <section id="content">
      <div id="liststate" class="hidden"></div>
      <ul id="eventlist"></ul>
      <div id="mapwrap">
        <h2 id="maptitle" class="maptitle">Kartenansicht</h2>
        <div id="map"></div>
      </div>
    </section>
  </main>

  <div id="detail" class="detail hidden" role="dialog" aria-modal="true" aria-labelledby="detail-titel">
    <div class="detail__card">
      <button id="detail-close" type="button" class="detail__close" aria-label="Schließen">✕</button>
      <h2 id="detail-titel"></h2>
      <div id="detail-body"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="/static/app.js?v=18"></script>
  <script src="/static/naehe.js?v=18"></script>
</body>
</html>
