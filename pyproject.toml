[project]
name = "kids-events-berlin"
version = "0.1.0"
description = "LLM-freier Meta-Aggregator für Veranstaltungen mit Kindern in Berlin"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "parsel>=1.9",
    "extruct>=0.16",
    "jsonpath-ng>=1.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
